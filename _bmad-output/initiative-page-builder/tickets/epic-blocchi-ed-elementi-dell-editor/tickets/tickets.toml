hitl = false
risk = "low"

[[entry]]
id = 3
type = "story"
title = "Classifier structure/content esteso a tutti i contratti"
description = "La classificazione structure/content dei campi è definita una sola volta in `packages/contracts` per ogni contratto e blocco, e pilota i permessi dell'editor e la sanitizzazione server-side."
verify = "Ogni campo di ogni blocco è classificato, un campo o blocco sconosciuto è trattato come `content` (fail-safe), e `puck-components` deriva i permessi dal classifier senza una seconda copia."
covers = ["R3"]
after = []
hitl = false
risk = "low"

[[entry]]
id = 4
type = "story"
title = "Sezioni nell'editor"
description = "Le sezioni disegnate in Penpot sono esposte in Puck rigide, aperte solo negli slot dichiarati (`allow` + `max`), con le forme disegnate come parti e i default del contratto come valori iniziali."
verify = "La sezione è registrata in `puckConfig`, gli slot accettano solo i blocchi dell'`allow` fino a `max`, e uno slot del contratto che in Penpot non si trova più è un blocco di `verify_component` che nomina slot e sezione."
covers = ["R1"]
after = []
hitl = false
risk = "low"

