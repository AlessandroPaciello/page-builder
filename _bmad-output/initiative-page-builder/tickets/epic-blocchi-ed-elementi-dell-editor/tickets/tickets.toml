[[entry]]
id = 1
type = "story"
title = "Ponte token→controlli Puck"
description = "Le opzioni dei campi Puck (gap/padding, radius) derivano dai token generati, così una modifica ai token propaghi sia alle classi sia ai menu dei blocchi."
verify = "Cambiare un token spacing o radius aggiorna sia le classi sia le opzioni disponibili nei campi dei blocchi."
covers = ["R1"]
after = []
hitl = false
risk = "low"

[[entry]]
id = 2
type = "story"
title = "Blocchi Puck come adapter dei contratti"
description = "I blocchi Puck espongono i contratti tramite la libreria del design system: campi dagli assi `option`, `permissions` derivate e render senza copie, con slot annidabili per Box, Flex, Grid e Columns."
verify = "Ogni blocco valida con lo schema di `@app/contracts` senza alcuna copia in `puck-components`, e solo gli assi `option` diventano campi."
covers = ["R1"]
