[[entry]]
id = 1
type = "story"
title = "Scaffolding greenfield del workspace"
description = "Il workspace è un monorepo full-TypeScript avviabile: `apps/web` (Next.js App Router) e `packages/`, creati con create-better-t-stack, pnpm + Turborepo, versioni pinnate come da spine e nessun residuo legacy."
verify = "L'app Next parte in dev senza errori, il monorepo espone `apps/web` e `packages/` con le versioni pinnate, e nessun residuo JHipster/Strapi è presente."
covers = ["R1"]
after = []
hitl = false
risk = "low"

