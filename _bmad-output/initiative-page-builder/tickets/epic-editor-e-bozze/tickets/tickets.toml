after = []
hitl = false
risk = "low"

[[entry]]
id = 3
type = "story"
title = "Pipeline payload server — validazione, structure/content, sanitizzazione XSS"
description = "Il core valida e sanifica il payload lato server prima di persistere: validazione con gli schemi di `@app/contracts` inclusi `allow`/`max` degli slot, classificazione structure/content e sanitizzazione dei campi content."
verify = "Un payload non conforme agli schemi è rifiutato con errore tipizzato, un Cliente che modifica un campo `structure` è rifiutato dal core, e un blocco fuori dall'allow-list o oltre il `max` di uno slot è rifiutato."
covers = ["R2"]
after = []
hitl = false
risk = "low"

