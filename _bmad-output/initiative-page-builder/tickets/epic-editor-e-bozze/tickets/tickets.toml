type = "story"
title = "Salvataggio bozza con snapshot immutabile"
description = "Salvare il layout crea una nuova PageVersion DRAFT con payload jsonb `{content, root, zones}` e `versionNumber` allocato dal core, preservando i block-id coniati dal client."
