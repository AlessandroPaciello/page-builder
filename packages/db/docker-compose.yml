name: page-builder

services:
  postgres:
    # Pinnata a patch (18.1), non tag floating — voce chiusa da Story 1.6.
    image: postgres:18.1
    container_name: page-builder-postgres
    environment:
      POSTGRES_DB: page_builder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - page_builder_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  page_builder_postgres_data:
