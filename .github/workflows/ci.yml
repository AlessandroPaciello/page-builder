name: CI

on:
  push:
    branches: [main]
  pull_request:

# Token a privilegi minimi sui run di PR; le pipeline sovrapposte sullo stesso
# ref si cancellano a vicenda (push ravvicinati → una sola esecuzione utile).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # Il test di integrazione dell'invariante di pubblicazione (AD-7) richiede
    # un Postgres reale: il gate deve essere rosso se DB o migration mancano,
    # mai verde vacuo. Credenziali allineate al placeholder DATABASE_URL sotto.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # `next build` importa `@app/env/web`, che lancia se `NEXT_PUBLIC_SERVER_URL`
      # manca. In CI non c'è nessun `.env` (non è committato): l'env di build non è
      # un input della pipeline, la validazione serve a chi deploya.
      SKIP_ENV_VALIDATION: "1"
      # Il postinstall di @app/db esegue `prisma generate`, che carica
      # prisma.config.ts e risolve DATABASE_URL anche se non si connette mai al
      # DB. In CI non c'è .env (non è committato): basta un placeholder.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
    steps:
      - uses: actions/checkout@v5

      # Senza `version:`: l'action legge `packageManager` da package.json, così
      # la versione di pnpm vive in un solo posto.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm check-types

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # Il test dell'invariante (AC#2 Story 1.3) parte su uno schema già
      # applicato: `migrate deploy` è il percorso di release (Story 1.6) e
      # applica le migration committate senza evolve.
      - name: Apply database migrations
        run: pnpm --filter @app/db exec prisma migrate deploy

      - name: Test
        run: pnpm test

      # Gate del regime design→codice (Story 2.6, AC #2): completezza
      # artefatti, rigenerazione a diff zero (render:check incluso), conformità
      # al contratto e a11y (suite ui con assert axe) — bloccanti. Il gate
      # drift gira dentro gates:render ma è bloccante SE E SOLO SE il runner
      # raggiunge il server MCP Penpot: qui non lo raggiunge → skip
      # documentato nel log (mai verde finto), riesecuzione manuale/nightly.
      - name: Render gates (completezza, rigenerazione, conformità, a11y)
        run: pnpm --filter @penpot-ds/scripts gates:render

      # Drift check schema↔migrations (voce 1-3, Story 1.6): un schema.prisma
      # che evolve senza migration committata diventa un gate rosso QUI, non
      # una scoperta al deploy. `migrate diff` non tocca il DB di DATABASE_URL:
      # applica le migration su uno shadow DB (stesso service postgres, DB
      # dedicato creato qui sotto). Exit: 0 = nessun drift, 2 = drift → rosso.
      - name: Create shadow database for drift check
        run: docker exec ${{ job.services.postgres.id }} psql -U ci -c "CREATE DATABASE ci_shadow;"

      - name: Drift check (schema ↔ migrations)
        run: pnpm --filter @app/db exec prisma migrate diff --from-migrations ./prisma/migrations --to-schema ./prisma/schema --exit-code
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          SHADOW_DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_shadow"

  # Gate docker (Story 1.6): l'immagine DEVE costruirsi dal repo pulito con
  # lockfile frozen. Runner GitHub ha Docker nativo, nessun service necessario.
  # Smoke test compose: percorso felice completo (postgres → migrate → app)
  # su DB vuoto, con verifica della risposta dell'app.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build runner image
        run: docker build --target runner --build-arg NEXT_PUBLIC_SERVER_URL=http://localhost:3000 -t page-builder-app:latest .

      - name: Build migrator image
        run: docker build --target migrator --build-arg NEXT_PUBLIC_SERVER_URL=http://localhost:3000 -t page-builder-migrate:latest .

      - name: Create compose env
        run: |
          printf '%s\n' \
            "POSTGRES_DB=ci" \
            "POSTGRES_USER=ci" \
            "POSTGRES_PASSWORD=ci" \
            "BETTER_AUTH_SECRET=ci-secret-32-characters-long-aaaaaaaaaaaa" \
            "BETTER_AUTH_URL=http://localhost:3000" \
            "CORS_ORIGIN=http://localhost:3000" \
            "NEXT_PUBLIC_SERVER_URL=http://localhost:3000" \
            > .env

      - name: Compose smoke test (postgres → migrate → app)
        run: |
          docker compose -f docker-compose.release.yml up -d --wait --wait-timeout 120 app \
            || { docker compose -f docker-compose.release.yml logs --no-color; exit 1; }

          # L'app DEVE rispondere: gate rosso, non verde vacuo.
          ok=""
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || true)
            if [ "$code" = "200" ]; then ok="yes"; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::L'app non risponde 200 su / nel compose di release"
            docker compose -f docker-compose.release.yml logs --no-color
            exit 1
          fi

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.release.yml down -v --remove-orphans
